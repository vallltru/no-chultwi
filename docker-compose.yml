services:
  # 1. MySQL 8.0 데이터베이스
  db:
    image: mysql:8.0
    container_name: nochultwi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nochultwidb}
      MYSQL_USER: ${MYSQL_USER:-nochultwi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 외부 인터넷 차단, 로컬(127.0.0.1)에서만 접속 허용 (보안)
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 2. Spring Boot 백엔드 서버 (Docker Hub 이미지 사용)
  backend:
    image: ${DOCKER_IMAGE}
    container_name: nochultwi-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-nochultwidb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER:-nochultwi_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      SCHOOL_UOS_API_KEY: ${SCHOOL_UOS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

# Local development / test profile (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:nochultwidb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# H2 web console stays disabled (it would require relaxing frame/CSRF protections)
spring.h2.console.enabled=false

# Allowed browser origins for the React user/admin apps
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

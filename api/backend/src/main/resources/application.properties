spring.application.name=backend

# Profile: local is the default for development/tests; production must set SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# Never expose internal error details (stack traces, exception class names, messages)
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Pure REST API server: disable static resource mappings to reduce attack surface
spring.web.resources.add-mappings=false

# JPA (OSIV disabled; timestamps normalized to the JDBC/JVM time zone = Asia/Seoul)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# Multipart (Spec 6.3: max 5 MiB per image).
# file-size-threshold above the max size keeps uploads in memory so face images are never written to temp files on disk.
# max-swallow-size prevents Tomcat from resetting the connection before returning the 413 JSON response.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
server.tomcat.max-swallow-size=10MB

# Jackson (Jackson 3 serializes java.time values as ISO-8601 strings by default)
spring.jackson.time-zone=Asia/Seoul

# Include the request correlation id in every log line
logging.pattern.level=%5p [%X{requestId:-}]

# Production profile (AWS EC2 + Docker MySQL).
# Credentials come from environment variables with NO defaults so startup fails fast if any is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Automatically creates/updates tables on initial MySQL container startup
spring.jpa.hibernate.ddl-auto=update

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

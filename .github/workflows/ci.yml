name: CI - Backend & AI Tests

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: api/backend

      - name: Run Backend unit & integration tests
        run: ./gradlew test --no-daemon
        working-directory: api/backend

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: api/backend/build/reports/tests/test/
          retention-days: 7

  ai-test:
    name: AI Service Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/ai/requirements-test.txt

      - name: Install lightweight AI test dependencies
        run: pip install -r requirements-test.txt
        working-directory: api/ai

      - name: Run AI service tests
        run: pytest -v
        working-directory: api/ai

name: Deploy Backend to EC2

on:
  push:
    branches:
      - dev
      - feat/cicd-pipeline
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 설정 및 Gradle 캐싱
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: api/backend

      # 4. Spring Boot bootJar 빌드 (테스트 제외로 빠른 빌드)
      - name: Build with Gradle
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: api/backend

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api/backend
          file: api/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest

      # 7. docker-compose.yml 파일을 EC2로 직접 전송 (Git 의존성 완전 제거)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/no-chultwi"

      # 8. EC2에서 최신 도커 이미지 당겨와서 가동 (3초 완료)
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 스왑 메모리 활성화 보장
            sudo swapon /swapfile 2>/dev/null || true

            mkdir -p ~/no-chultwi && cd ~/no-chultwi
            
            # .env 파일이 없으면 기본 설정 생성
            if [ ! -f .env ]; then
              echo "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest" > .env
              echo "MYSQL_ROOT_PASSWORD=nochultwi_root_2026!" >> .env
              echo "MYSQL_DATABASE=nochultwidb" >> .env
              echo "MYSQL_USER=nochultwi_user" >> .env
              echo "MYSQL_PASSWORD=nochultwi_pw_2026!" >> .env
              echo "SERVER_PORT=8080" >> .env
              echo "CORS_ALLOWED_ORIGINS=*" >> .env
            else
              # DOCKER_IMAGE만 최신 태그로 갱신
              if grep -q "^DOCKER_IMAGE=" .env; then
                sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest|g" .env
              else
                echo "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest" >> .env
              fi
            fi
            
            # Docker Hub에서 방금 푸시된 최신 이미지만 다운로드 (약 3초 소요)
            docker compose pull backend
            
            # 백엔드 및 DB 컨테이너 실행 (MySQL healthcheck 통과 후 백엔드 실행)
            docker compose up -d --remove-orphans
            
            # 이전 버전의 미사용 도커 이미지 청소
            docker image prune -f

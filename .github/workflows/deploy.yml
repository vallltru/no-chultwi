name: Deploy Backend to EC2

on:
  push:
    branches:
      - dev
    paths:
      - 'api/backend/src/main/**'
      - 'api/backend/build.gradle'
      - 'api/backend/settings.gradle'
      - 'api/backend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 설정 및 Gradle 캐싱
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: api/backend

      # 4. Spring Boot bootJar 빌드 (테스트는 PR CI에서 검증 완료)
      - name: Build with Gradle
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: api/backend

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api/backend
          file: api/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest

      # 7. docker-compose.yml 파일을 EC2로 직접 전송 (Git 의존성 완전 제거)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/no-chultwi"

      # 8. EC2에서 최신 도커 이미지 당겨와서 가동
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nochultwi-backend:latest
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          SCHOOL_UOS_API_KEY: ${{ secrets.SCHOOL_UOS_API_KEY }}
          AI_INTERNAL_SECRET: ${{ secrets.AI_INTERNAL_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE,MYSQL_ROOT_PASSWORD,MYSQL_PASSWORD,SCHOOL_UOS_API_KEY,AI_INTERNAL_SECRET
          script: |
            set -e
            # 스왑 메모리 활성화 보장
            sudo swapon /swapfile 2>/dev/null || true

            mkdir -p ~/no-chultwi && cd ~/no-chultwi

            # .env 파일이 없으면 GitHub Secrets 기반으로 초기 생성 (평문 비밀번호 하드코딩 제거)
            if [ ! -f .env ]; then
              if [ -z "${MYSQL_ROOT_PASSWORD}" ] || [ -z "${MYSQL_PASSWORD}" ]; then
                echo "ERROR: .env file not found and MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD secrets are not configured." >&2
                exit 1
              fi
              umask 077
              {
                printf 'DOCKER_IMAGE=%s\n' "${DOCKER_IMAGE}"
                printf 'MYSQL_ROOT_PASSWORD=%s\n' "${MYSQL_ROOT_PASSWORD}"
                printf 'MYSQL_DATABASE=%s\n' "nochultwidb"
                printf 'MYSQL_USER=%s\n' "nochultwi_user"
                printf 'MYSQL_PASSWORD=%s\n' "${MYSQL_PASSWORD}"
                printf 'SERVER_PORT=%s\n' "8080"
                printf 'CORS_ALLOWED_ORIGINS=%s\n' "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
                printf 'SCHOOL_UOS_API_KEY=%s\n' "${SCHOOL_UOS_API_KEY}"
                printf 'AI_FACE_ENABLED=%s\n' "false"
                printf 'AI_FACE_SERVER_URL=%s\n' "http://localhost:8000"
                printf 'AI_SIMILARITY_THRESHOLD=%s\n' "0.42"
                printf 'AI_INTERNAL_SECRET=%s\n' "${AI_INTERNAL_SECRET}"
              } > .env
            else
              # DOCKER_IMAGE만 최신 태그로 갱신 (기존 EC2 .env의 비밀번호·커스텀 설정 보존)
              if grep -q "^DOCKER_IMAGE=" .env; then
                sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=${DOCKER_IMAGE}|g" .env
              else
                printf 'DOCKER_IMAGE=%s\n' "${DOCKER_IMAGE}" >> .env
              fi
            fi

            # Docker Hub에서 방금 푸시된 최신 이미지만 다운로드
            docker compose pull backend

            # 백엔드 및 DB 컨테이너 실행 (MySQL healthcheck 통과 후 백엔드 실행)
            docker compose up -d --remove-orphans

            # 이전 버전의 미사용 도커 이미지 청소
            docker image prune -f
